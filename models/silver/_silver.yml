version: 2

models:
  - name: silver_claims
    description: "Deduped to 12,000. Dates recovered where possible, flagged where not."
    columns:
      - name: claim_id
        tests: [unique, not_null]        # errors here — Silver DOES promise uniqueness
      - name: status
        tests:
          - accepted_values:
              values: ['OPEN', 'CLOSED', 'DENIED', 'IN REVIEW']

  - name: silver_brokers
    columns:
      - name: broker_id
        tests: [unique, not_null]

  - name: silver_policies
    description: "SCD Type 2. Expected 5,602 rows, 5,000 current."
    columns:
      - name: policy_id
        tests: [not_null]                # NOT unique — a policy can have many versions
      - name: valid_from
        tests: [not_null]
      - name: is_current
        tests: [not_null]
