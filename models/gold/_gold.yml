version: 2

models:
  - name: dim_broker
    columns:
      - name: broker_key
        tests: [unique, not_null]
  - name: dim_policy
    description: "SCD2. 5,602 rows — one per policy version."
    columns:
      - name: policy_key
        tests: [unique, not_null]
      - name: policy_natural_key
        tests: [not_null]
  - name: dim_date
    columns:
      - name: date_day
        tests: [unique, not_null]
  - name: fct_claim
    description: "Grain: one claim. 12,000 rows. Point-in-time joined to the policy version in force."
    columns:
      - name: claim_id
        tests: [unique, not_null]
      - name: amount
        tests: [not_null]

  - name: fct_policy_month
    description: >
      One row per policy version per month of its term. Carries earned premium
      (straight-line pro-rata by days on risk) and claims incurred in that month, so
      loss ratio can be computed at any grain. Earned, not written — comparing claims
      against written premium makes every month a policy is sold look wildly
      profitable and every month after look like a disaster.
    columns:
      - name: policy_key
        tests: [not_null]
      - name: month_start
        tests: [not_null]
      - name: earned_premium
        tests: [not_null]
      - name: days_on_risk
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 31
